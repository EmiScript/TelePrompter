<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Teleprompter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100dvh;
            overflow: hidden;
            background-color: black;
        }

        .mask-fade {
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
        }

        #controls-container {
            padding-bottom: calc(1rem + env(safe-area-inset-bottom));
        }

        .text-outline {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9), -2px -2px 4px rgba(0,0,0,0.9);
        }
        
        .recording-active {
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0% { background-color: #dc2626; }
            50% { background-color: #991b1b; }
            100% { background-color: #dc2626; }
        }
    </style>
</head>
<body class="relative w-full text-white bg-black">

    <!-- Sfondo: Feed Video -->
    <video id="camera-feed" class="absolute inset-0 w-full h-[100dvh] object-cover z-0" autoplay playsinline muted></video>

    <!-- Overlay Prompter -->
    <div id="scroll-container" class="absolute inset-0 z-10 overflow-y-auto pointer-events-auto mask-fade pb-[150px]">
        <div id="prompter-text" class="w-full max-w-2xl mx-auto px-4 font-semibold text-center text-outline text-4xl leading-relaxed break-words" style="padding-top: 60dvh; padding-bottom: 60dvh;">
            Guarda nell'obiettivo e inizia a parlare.<br><br>
            Premi "Registra" per avviare il video, poi premi "Scorri" per far muovere il testo.<br><br>
            Il video finale sarà pulito, senza questo testo in sovrimpressione.
        </div>
    </div>

    <!-- Pannello di controllo -->
    <div id="controls-container" class="absolute bottom-0 left-0 w-full z-20 bg-black/80 backdrop-blur-md border-t border-gray-700 p-4">
        <div class="max-w-2xl mx-auto flex flex-col gap-4">
            
            <!-- Bottoni -->
            <div class="flex justify-between items-center gap-2">
                <button id="btn-edit" class="bg-gray-700 hover:bg-gray-600 py-3 rounded-lg font-bold flex-1 text-xs">Modifica</button>
                <button id="btn-play" class="bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-bold flex-1 text-xs">Scorri</button>
                <button id="btn-reset" class="bg-gray-600 hover:bg-gray-500 py-3 rounded-lg font-bold flex-1 text-xs">Inizio</button>
                <button id="btn-record" class="bg-red-600 hover:bg-red-500 py-3 rounded-lg font-bold flex-1 text-xs text-white">⏺ Registra</button>
            </div>

            <!-- Cursori -->
            <div class="flex gap-4">
                <div class="flex-1 flex flex-col">
                    <label class="text-xs font-bold text-gray-300 mb-2">Velocità: <span id="speed-val">2</span></label>
                    <input type="range" id="speed-slider" min="0.5" max="5" step="0.1" value="2" class="w-full h-2 bg-gray-600 rounded-lg appearance-none cursor-pointer">
                </div>
                <div class="flex-1 flex flex-col">
                    <label class="text-xs font-bold text-gray-300 mb-2">Testo</label>
                    <input type="range" id="size-slider" min="20" max="80" step="2" value="36" class="w-full h-2 bg-gray-600 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>
        </div>
    </div>

    <!-- Modale Modifica Testo -->
    <div id="edit-modal" class="hidden absolute inset-0 z-50 bg-black p-4 flex flex-col">
        <h2 class="text-xl font-bold mb-2 pt-8">Modifica Copione</h2>
        <textarea id="text-editor" class="flex-1 bg-gray-800 text-white p-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg"></textarea>
        <div class="flex justify-end gap-2 mt-4 pb-8">
            <button id="btn-cancel" class="bg-gray-600 px-6 py-3 rounded-lg font-bold">Annulla</button>
            <button id="btn-save" class="bg-green-600 px-6 py-3 rounded-lg font-bold">Salva</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('camera-feed');
        const scrollContainer = document.getElementById('scroll-container');
        const prompterText = document.getElementById('prompter-text');
        const btnPlay = document.getElementById('btn-play');
        const btnReset = document.getElementById('btn-reset');
        const btnEdit = document.getElementById('btn-edit');
        const btnRecord = document.getElementById('btn-record');
        
        let isPlaying = false;
        let scrollSpeed = 2;
        let animationId;
        
        // Variabili per la registrazione
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;

        async function initCamera() {
            try {
                // Richiede sia video (frontale) che audio
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user" },
                    audio: true 
                });
                video.srcObject = stream;

                // Configura il registratore
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/mp4' });
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/mp4' });
                    const url = URL.createObjectURL(blob);
                    
                    // Crea un link invisibile per scaricare il video
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = `video_social_${new Date().getTime()}.mp4`;
                    document.body.appendChild(a);
                    a.click();
                    
                    setTimeout(() => {
                        document.body.removeChild(a);
                        window.URL.revokeObjectURL(url);
                    }, 100);
                    
                    recordedChunks = [];
                };

            } catch (err) {
                alert("Errore fotocamera/microfono. Assicurati di aver dato i permessi.");
                console.error(err);
            }
        }

        // Gestione Registrazione
        btnRecord.addEventListener('click', () => {
            if (!mediaRecorder) return;
            
            if (!isRecording) {
                // Inizia a registrare
                mediaRecorder.start();
                isRecording = true;
                btnRecord.textContent = '⏹ Stoppa Video';
                btnRecord.classList.add('recording-active');
            } else {
                // Ferma la registrazione
                mediaRecorder.stop();
                isRecording = false;
                btnRecord.textContent = '⏺ Registra';
                btnRecord.classList.remove('recording-active');
            }
        });

        // Loop di scorrimento
        function scrollLoop() {
            if (isPlaying) {
                scrollContainer.scrollTop += scrollSpeed;
            }
            animationId = requestAnimationFrame(scrollLoop);
        }

        btnPlay.addEventListener('click', () => {
            isPlaying = !isPlaying;
            btnPlay.textContent = isPlaying ? "Pausa" : "Scorri";
            btnPlay.classList.toggle('bg-blue-600', !isPlaying);
            btnPlay.classList.toggle('bg-yellow-600', isPlaying);
        });

        btnReset.addEventListener('click', () => {
            isPlaying = false;
            btnPlay.textContent = "Scorri";
            btnPlay.className = "bg-blue-600 py-3 rounded-lg font-bold flex-1 text-xs";
            scrollContainer.scrollTo({ top: 0, behavior: 'smooth' });
        });

        document.getElementById('speed-slider').addEventListener('input', (e) => {
            scrollSpeed = parseFloat(e.target.value);
            document.getElementById('speed-val').textContent = scrollSpeed;
        });

        document.getElementById('size-slider').addEventListener('input', (e) => {
            prompterText.style.fontSize = e.target.value + 'px';
        });

        btnEdit.addEventListener('click', () => {
            isPlaying = false; 
            btnPlay.textContent = "Scorri";
            btnPlay.className = "bg-blue-600 py-3 rounded-lg font-bold flex-1 text-xs";
            document.getElementById('text-editor').value = prompterText.innerHTML.replace(/<br\s*[\/]?>/gi, '\n').trim();
            document.getElementById('edit-modal').classList.remove('hidden');
        });

        document.getElementById('btn-save').addEventListener('click', () => {
            prompterText.innerHTML = document.getElementById('text-editor').value.replace(/\n/g, '<br>');
            document.getElementById('edit-modal').classList.add('hidden');
            scrollContainer.scrollTop = 0; 
        });

        document.getElementById('btn-cancel').addEventListener('click', () => {
            document.getElementById('edit-modal').classList.add('hidden');
        });

        initCamera();
        animationId = requestAnimationFrame(scrollLoop);
    </script>
</body>
</html>
